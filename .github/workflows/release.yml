name: Release

# Publishes to PyPI when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Authentication is PyPI Trusted Publishing (OIDC), so there is no API token
# anywhere: not in the repo, not in secrets, not on anyone's laptop. GitHub
# proves the workflow's identity to PyPI directly. See docs/publishing.md for
# the one-time setup.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CACHELLM_EMBEDDING_BACKEND: hash
      CACHELLM_DEFAULT_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras

      - name: Tag must match the version in pyproject
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(uv run python -c "import cachellm; print(cachellm.__version__)")
          echo "tag=$TAG  package=$PKG"
          test "$TAG" = "$PKG" || {
            echo "::error::tag $TAG does not match cachellm.__version__ $PKG"
            exit 1
          }

      - run: uv run ruff check src tests bench eval
      - run: uv run mypy
      - name: Tests
        env:
          CACHELLM_TEST_REDIS_URL: redis://localhost:6379/0
        run: uv run pytest -q

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Validate metadata the way PyPI will
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cachellm-proxy
    permissions:
      id-token: write        # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish release with the built artefacts attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
